name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arch-pkg:
    name: Arch 打包（makepkg）
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      # 先装 git —— 容器镜像里没有，actions/checkout 依赖它。
      - name: 安装构建工具
        run: |
          pacman -Syu --noconfirm --disable-download-timeout
          pacman -S --noconfirm --needed --disable-download-timeout git nodejs npm

      - uses: actions/checkout@v7

      # 运行期依赖不进构建环境（electron41 装完 100MB+），但必须确认它们还在官方仓库里。
      # 这正是之前踩过的坑：Arch 的 electron 是元包、不含 /usr/bin/electron。
      - name: 校验运行期依赖仍在仓库中
        run: pacman -Si electron41 libayatana-appindicator

      - name: 源码语法检查
        run: |
          for f in src/*.js src/l1/*.js src/l1/*.cjs scripts/*.cjs; do
            node --check "$f"
          done

      # makepkg 拒绝以 root 运行；--nodeps 跳过 depends 检查（上面已单独校验过）。
      - name: makepkg
        working-directory: arch
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c 'makepkg -f --nodeps --noconfirm'

      - name: 校验产物
        working-directory: arch
        run: |
          ls -la ./*.pkg.tar.zst
          # 回归护栏：启动器必须解析到 electron41 的绝对路径，
          # 不能是 0.1.0-1 那个 `exec electron`（Arch 没这个可执行文件）。
          bsdtar -xOf ./*.pkg.tar.zst usr/bin/netease-st | tee /tmp/wrapper.sh
          grep -q '/usr/lib/electron41/electron' /tmp/wrapper.sh
          # 包里不应出现网易的静态资源
          if bsdtar -tf ./*.pkg.tar.zst | grep -qiE 'orpheus|\.ntpk|webfiles'; then
            echo '::error::包里出现了网易的静态资源，不应该提交/分发'
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: netease-st-arch-pkg
          path: arch/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14

  release:
    name: 发布（打 tag 时）
    if: startsWith(github.ref, 'refs/tags/v')
    needs: arch-pkg
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: netease-st-arch-pkg
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.pkg.tar.zst
